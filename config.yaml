# Wat telt als "relevante" vacature voor Mojeo.
# Lege lijst = geen filter op dat veld.

relevance:
  # Relevant als de functietitel een van deze termen bevat (hoofdletterongevoelig).
  title_keywords:
    - projectleider
    - projectmanager
    - project manager
    - programmamanager
    - programma manager
    - program manager
    - programmaleider
    - pmo
    - project lead
    - projectcontroller
    - agile coach
    - scrum master
    - scrummaster
    - product owner
    - release train
    - change manager
    - kwartiermaker
  # Optioneel: alleen deze branches (leeg = alle branches).
  industries: []

# Functiegroepen voor het dashboard. Volgorde telt: een vacature valt in de eerste groep
# waarvan een term in de titel staat. "default: true" = standaard aan in het dashboard.
function_groups:
  - {name: PMO, default: true, terms: [pmo]}
  - {name: Programma, default: true, terms: [programmamanager, programma manager, program manager, programmaleider]}
  - {name: Agile, default: true, terms: [agile coach, scrum master, scrummaster, product owner, release train]}
  - {name: Project, default: true, terms: [projectleider, projectmanager, project manager, project lead,
                                           projectcontroller, change manager, kwartiermaker]}
  - {name: Informatie & analyse, terms: [business analist, business analyst, informatieanalist, informatiemanager,
                                         informatieadviseur, functioneel beheer, functioneel consultant,
                                         data analist, data analyst, data steward, business intelligence]}
  - {name: IT-specialist, terms: [architect, engineer, developer, ontwikkelaar, security officer, ciso, tiso,
                                  systeembeheer, devops, ict, " it ", sap ]}
  - {name: Management, terms: [manager, directeur, teamleider, teammanager, hoofd , leidinggevende, bestuurder]}
  - {name: Advies & beleid, terms: [adviseur, beleid, consultant, regisseur]}

# Branches standaard aan in het dashboard (Overheid wordt herkend op organisatienaam, zie sectors).
default_branches: [Overheid, "Zorg & Welzijn", "ICT & Automatisering", "Management, Beleid & Directie"]

# Sectoren met prioriteit voor Mojeo. Vacatures krijgen een sectorlabel;
# prioriteitssectoren worden in het rapport gemarkeerd (niet weggefilterd).
sectors:
  Overheid:
    company_keywords: [gemeente, provincie, waterschap, rijkswaterstaat, ministerie,
                       rijksdienst, cbs, uwv, ggd, veiligheidsregio, belastingdienst,
                       politie, defensie, rechtspraak, dji, rws]
  Zorg:
    industries: [zorg & welzijn]
  ICT:
    industries: [ict & automatisering]
  Management:
    industries: ["management, beleid & directie", management]
priority_sectors: [Overheid, Zorg, ICT, Management]

region:
  regions: []   # leeg = alles (Limburg + Brabant)
  cities: []

# Bemiddelaars uitsluiten: bedrijfsnamen die een van deze woorden bevatten.
exclude_companies:
  - uitzend
  - randstad
  - adecco
  - tempo-team
  - youngcapital
  - start people
  - werving
  - recruitment
  - detachering
  - payroll
